[project]
name = "chartsmith-backend"
version = "0.1.0"
description = "ChartSmith — Helm upgrade advisor backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "deepdiff>=8.0.1",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "asyncpg>=0.29.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[project.scripts]
chartsmith = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]