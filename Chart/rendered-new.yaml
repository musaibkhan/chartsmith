apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: default
  labels:
    helm.sh/chart: loki-17.4.4
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: "3.6.1"
data:
  config.yaml: |
    
    analytics:
      reporting_enabled: false
    auth_enabled: false
    bloom_build:
      builder:
        planner_address: loki-bloom-planner-headless.default.svc.cluster.local:9095
      enabled: false
    bloom_gateway:
      client:
        addresses: dnssrvnoa+_grpc._tcp.loki-bloom-gateway-headless.default.svc.cluster.local
      enabled: false
    chunk_store_config:
      chunk_cache_config:
        background:
          writeback_buffer: 500000
          writeback_goroutines: 1
          writeback_size_limit: 500MB
        default_validity: 0s
        memcached:
          batch_size: 4
          parallelism: 5
        memcached_client:
          addresses: dnssrvnoa+_memcached-client._tcp.loki-chunks-cache.default.svc.cluster.local
          consistent_hash: true
          max_idle_conns: 72
          timeout: 2000ms
    common:
      compactor_grpc_address: 'loki-compactor.default.svc.cluster.local:9095'
      path_prefix: /var/loki
      replication_factor: 3
      storage:
        s3:
          bucketnames: quandoo-loki-svc
          insecure: false
          s3: s3://eu-west-1/quandoo-loki-svc
          s3forcepathstyle: false
    compactor:
      delete_request_store: aws
      retention_enabled: true
      working_directory: /data/retention
    distributor:
      max_recv_msg_size: 1073741824
    frontend:
      scheduler_address: loki-query-scheduler-headless.default.svc.cluster.local:9095
      tail_proxy_url: http://loki-querier.default.svc.cluster.local:3100
    frontend_worker:
      scheduler_address: loki-query-scheduler-headless.default.svc.cluster.local:9095
    index_gateway:
      mode: simple
    ingester:
      autoforget_unhealthy: true
      chunk_encoding: snappy
      chunk_idle_period: 30m
      chunk_retain_period: 1m
      chunk_target_size: 2097152
      max_chunk_age: 2h
      sync_min_utilization: 0
      sync_period: 0s
      wal:
        checkpoint_duration: 5m
        dir: /var/loki/wal
        flush_on_shutdown: true
        replay_memory_ceiling: 1GB
    limits_config:
      allow_structured_metadata: false
      cardinality_limit: 100000
      creation_grace_period: 10m
      increment_duplicate_timestamp: true
      ingestion_burst_size_mb: 1024
      ingestion_rate_mb: 200
      max_cache_freshness_per_query: 10m
      max_chunks_per_query: 3000000
      max_concurrent_tail_requests: 10
      max_global_streams_per_user: 20000
      max_line_size: 1MB
      max_line_size_truncate: true
      max_query_parallelism: 256
      max_query_series: 20000
      max_streams_matchers_per_query: 2000
      per_stream_rate_limit: 50MB
      per_stream_rate_limit_burst: 100MB
      query_timeout: 30m
      reject_old_samples: true
      reject_old_samples_max_age: 2h
      retention_period: 90d
      retention_stream:
      - period: 7d
        priority: 1
        selector: '{cluster=~"(eks|gke)-(dev|int)"}'
      - period: 15d
        priority: 2
        selector: '{cluster=~"(eks|gke)-stg"}'
      split_queries_by_interval: 30m
      tsdb_max_bytes_per_shard: 5GB
      tsdb_max_query_parallelism: 1024
      unordered_writes: true
      volume_enabled: true
    memberlist:
      abort_if_cluster_join_fails: true
      advertise_port: 7946
      bind_port: 7946
      join_members:
      - loki-memberlist.default.svc.cluster.local
      - loki-memberlist
      max_join_backoff: 1m
      max_join_retries: 10
      min_join_backoff: 1s
      rejoin_interval: 90s
    pattern_ingester:
      enabled: true
    querier:
      max_concurrent: 8
      multi_tenant_queries_enabled: true
      query_ingesters_within: 2h
      tail_max_duration: 15m
    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          background:
            writeback_buffer: 500000
            writeback_goroutines: 1
            writeback_size_limit: 500MB
          default_validity: 12h
          memcached_client:
            addresses: dnssrvnoa+_memcached-client._tcp.loki-results-cache.default.svc.cluster.local
            consistent_hash: true
            timeout: 500ms
            update_interval: 1m
    runtime_config:
      file: /etc/loki/runtime-config/runtime-config.yaml
    schema_config:
      configs:
      - from: "2024-10-01"
        index:
          period: 24h
          prefix: loki_index_
        object_store: aws
        schema: v13
        store: tsdb
    server:
      graceful_shutdown_timeout: 5s
      grpc_listen_port: 9095
      grpc_server_max_concurrent_streams: 1000
      grpc_server_max_recv_msg_size: 134217728
      grpc_server_max_send_msg_size: 134217728
      grpc_server_min_time_between_pings: 10s
      grpc_server_ping_without_stream_allowed: true
      http_listen_port: 3100
      http_server_idle_timeout: 30m
      http_server_read_timeout: 30m
      http_server_write_timeout: 30m
      log_level: info
    storage_config:
      bloom_shipper:
        working_directory: /var/loki/data/bloomshipper
      boltdb_shipper:
        index_gateway_client:
          server_address: dns+loki-index-gateway-headless.default.svc.cluster.local:9095
      hedging:
        at: 250ms
        max_per_second: 20
        up_to: 3
      tsdb_shipper:
        index_gateway_client:
          server_address: dns+loki-index-gateway-headless.default.svc.cluster.local:9095
      use_thanos_objstore: false
    tracing:
      enabled: false
    ui:
      enabled: true
