  enabled: true
  replicas: 2

  nodeSelector:
    k8s.quandoo.com/arch: arm64
    topology.kubernetes.io/zone: eu-west-1c

  tolerations:
    - key: k8s.quandoo.com/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

results-cache:
  enabled: true
  replicas: 2

  nodeSelector:
    k8s.quandoo.com/arch: arm64
    topology.kubernetes.io/zone: eu-west-1c

  tolerations:
    - key: k8s.quandoo.com/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

rollout_operator:
  enabled: true

  nodeSelector:
    k8s.quandoo.com/arch: arm64
    topology.kubernetes.io/zone: eu-west-1c

  tolerations:
    - key: k8s.quandoo.com/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

minio:
  enabled: false

nginx:
  enabled: false

gateway:
  enabledNonEnterprise: true
  replicas: 2

  ingress:
    enabled: true
    ingressClassName: alb

    annotations:
      alb.ingress.kubernetes.io/group.name: devops-services
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/ssl-redirect: '443'

    hosts:
      - host: mimir-gateway.svc.quandoo.com
        paths:
          - path: /
            pathType: Prefix

    tls:
      - hosts:
          - mimir-gateway.svc.quandoo.com

  nginx:
    config:
      httpSnippet: |
        large_client_header_buffers 8 64k;
        client_header_buffer_size 64k;

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 512Mi

  nodeSelector:
    k8s.quandoo.com/arch: arm64
    topology.kubernetes.io/zone: eu-west-1c

  tolerations:
    - key: k8s.quandoo.com/arch
      operator: Equal
      value: arm64
      effect: NoSchedule

metaMonitoring:
  serviceMonitor:
    enabled: true
    interval: 15s

